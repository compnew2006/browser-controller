name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      # Machine-local generated output (code-graph indexes, browser scratch, coverage).
      # .gitignore cannot protect a path once it is tracked, so assert that here.
      - name: generated indexes stay untracked
        run: |
          tracked=$(git ls-files -- .codebase-memory graphify-out .serena .playwright-mcp .playwright-cli .changes .agents .native-host coverage mcp-server/dist)
          test -z "$tracked" || { echo "generated output is tracked again:"; echo "$tracked"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run security:audit
      # Report advisories in the development tree without making them the
      # production dependency gate; security:audit above remains blocking.
      - name: report full dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run context:lint
      # Token-budget check. The command is wired in, but the CAP is still an open owner
      # decision, so no threshold is enforced yet: this step only fails if the measurement
      # itself fails. Value measured 2026-10-31: 2,538 tokens across the 2 rule files
      # (.cursor/rules/project.mdc 1,581 + AGENTS.md 957). That number moves while
      # .cursor/rules/project.mdc or AGENTS.md is edited, so re-run `npm run context:measure`
      # rather than trusting this comment. Add the cap here once the owner decides it; until
      # then this is a tripwire, not a budget.
      - run: npm run context:measure
      - run: npm run lint
      # Architectural fitness functions: the layering boundaries (core/ neutral,
      # vault/ independent of memory/, protocol/ free of the tools layer) proved
      # by parsing the real imports, so a wrong dependency fails the build
      # instead of waiting for a review to notice it.
      - run: npm run arch:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Isolated daemon, extension copy, profile and synthetic site; does not
      # use the native messaging pairing host or a real browser profile.
      - run: npm run smoke:ci
