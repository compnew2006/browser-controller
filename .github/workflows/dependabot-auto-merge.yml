name: Dependabot review required

on: pull_request

# A lockfile-only update can change a runtime transitive dependency. File paths
# alone cannot prove that a dependency update leaves pairing or the wire safe.
# Do not grant this workflow write access or enable automatic merging.
permissions:
  contents: read

jobs:
  review-required:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Require a manual review
        run: echo 'Review this dependency update and its CI results before merging.'
