<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- brand gradient, consistent with the in-page activity overlay -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#eef0ff" stop-opacity="0.9"/>
    </linearGradient>
    <!-- soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
    <clipPath id="round">
      <rect x="18" y="22" width="92" height="74" rx="12"/>
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- subtle highlight -->
  <rect x="0" y="0" width="128" height="64" rx="28" fill="#ffffff" opacity="0.06"/>

  <!-- browser window -->
  <g filter="url(#shadow)">
    <rect x="18" y="22" width="92" height="74" rx="12" fill="url(#glass)"/>
  </g>

  <!-- window content clipped to rounded rect -->
  <g clip-path="url(#round)">
    <!-- title bar -->
    <rect x="18" y="22" width="92" height="16" fill="#4338ca" opacity="0.12"/>
    <!-- traffic-light dots -->
    <circle cx="30" cy="30" r="3" fill="#ef4444"/>
    <circle cx="40" cy="30" r="3" fill="#f59e0b"/>
    <circle cx="50" cy="30" r="3" fill="#22c55e"/>

    <!-- content lines -->
    <rect x="28" y="50" width="44" height="5" rx="2.5" fill="#a5b4fc"/>
    <rect x="28" y="62" width="60" height="5" rx="2.5" fill="#c7d2fe"/>
    <rect x="28" y="74" width="36" height="5" rx="2.5" fill="#c7d2fe"/>
  </g>

  <!-- the controller: a cursor/pointer, signifying AI control of the browser -->
  <g filter="url(#shadow)">
    <!-- pointer body -->
    <path d="M74 58 L74 104 L84 92 L98 116 L107 111 L93 87 L108 87 Z"
          fill="#ffffff" stroke="#4338ca" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
