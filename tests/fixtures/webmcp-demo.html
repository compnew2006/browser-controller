<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebMCP demo fixture</title>
</head>
<body>
  <!--
    Manual / real-Chrome fixture for browser_webmcp_list and browser_webmcp_call
    (specs/webmcp-support, task T9). Serve it from http://localhost (WebMCP needs
    a secure context) in a Chrome with WebMCP enabled
    (chrome://flags/#enable-webmcp-testing or --enable-features=WebMCP).
  -->
  <h1>WebMCP demo</h1>
  <p id="status">Registering tools…</p>
  <ul id="todos"></ul>

  <!-- Declarative tools: the browser fills the form; without toolautosubmit it
       then waits for the user to press Submit. -->
  <form toolname="search_form" tooldescription="Search the demo catalog." id="search-form">
    <label>Query <input name="query" required toolparamdescription="Search text"></label>
    <button type="submit">Search</button>
  </form>
  <form toolname="subscribe" tooldescription="Subscribe an email address to the newsletter." toolautosubmit id="subscribe-form">
    <label>Email <input name="email" type="email" required></label>
    <button type="submit">Subscribe</button>
  </form>

  <!-- Declarative forms inside shadow roots: Chrome registers them too, and a
       closed root is invisible to page script (the extension scans it over CDP). -->
  <div id="open-host"></div>
  <div id="closed-host"></div>

  <!-- Same-origin iframe that registers its own `echo` (same name as the main frame's). -->
  <iframe src="webmcp-frame.html" title="WebMCP frame"></iframe>

  <script>
    const mc = document.modelContext;
    const status = document.getElementById('status');
    const todos = document.getElementById('todos');

    function register(tool) {
      // registerTool returns a promise in the spec; tolerate a sync return too.
      return Promise.resolve(mc.registerTool(tool)).catch((err) => {
        status.textContent = `registerTool(${tool.name}) failed: ${err.message}`;
      });
    }

    if (!mc) {
      status.textContent = 'WebMCP is not available in this browser.';
    } else {
      register({
        name: 'echo',
        title: 'Echo',
        description: 'Return the given message unchanged.',
        inputSchema: { type: 'object', properties: { message: { type: 'string' } }, required: ['message'] },
        annotations: { readOnlyHint: true },
        execute: async ({ message }) => `echo: ${message}`,
      });
      register({
        name: 'add_todo',
        description: 'Add an item to the visible to-do list.',
        inputSchema: { type: 'object', properties: { text: { type: 'string' } }, required: ['text'] },
        execute: async ({ text }) => {
          const li = document.createElement('li');
          li.textContent = text;
          todos.append(li);
          return `Added to-do: ${text} (total ${todos.children.length})`;
        },
      });
      register({
        name: 'place_order',
        description: 'Place a (fake) order. Consequential: needs confirmation.',
        inputSchema: { type: 'object', properties: { item: { type: 'string' } } },
        annotations: { consequentialHint: true },
        execute: async ({ item }) => {
          window.__orders = (window.__orders || 0) + 1; // lets a test prove it did (not) run
          return `Order placed: ${item}`;
        },
      });
      register({
        name: 'slow_tool',
        description: 'Never finishes on its own and ignores the abort signal.',
        inputSchema: { type: 'object', properties: {} },
        execute: () => new Promise(() => {}),
      });
      register({
        name: 'throws_tool',
        // Chrome does not pass this message to the caller: executeTool rejects
        // with a generic UnknownError (the spec hides tool errors on purpose).
        description: 'Always throws.',
        inputSchema: { type: 'object', properties: {} },
        execute: async () => { throw new Error('boom from throws_tool'); },
      });
      register({
        name: 'big_output',
        description: 'Return a very large string.',
        inputSchema: { type: 'object', properties: {} },
        annotations: { readOnlyHint: true },
        execute: async () => 'x'.repeat(120_000),
      });
      register({
        name: 'navigate_away',
        description: 'Navigate this page to a new document (never reports back).',
        inputSchema: { type: 'object', properties: {} },
        execute: () => {
          location.href = `${location.pathname}?navigated=${Date.now()}`;
          return new Promise(() => {}); // the outcome is lost with the old document
        },
      });
      register({
        name: 'dup_tool',
        description: 'Imperative tool; the iframe has a declarative form with the same name.',
        inputSchema: { type: 'object', properties: {} },
        execute: async () => 'main dup_tool ran',
      });
      setTimeout(() => register({
        name: 'late_tool',
        description: 'Registered 1.5 s after load.',
        inputSchema: { type: 'object', properties: {} },
        execute: async () => 'late tool ran',
      }), 1_500);
      status.textContent = 'Tools registered.';
    }

    // An agent-invoked autosubmit returns its result instead of navigating.
    document.getElementById('subscribe-form').addEventListener('submit', (event) => {
      if (!event.agentInvoked) return;
      event.preventDefault();
      const email = new FormData(event.target).get('email');
      event.respondWith(Promise.resolve(`Subscribed ${email}`));
    });

    // Shadow-root forms; window.__shadowSubmits proves whether one was submitted.
    const shadowForm = (name, description, autosubmit) => `<form toolname="${name}" tooldescription="${description}"${autosubmit ? ' toolautosubmit' : ''}>`
      + '<label>Query <input name="q"></label><button type="submit">Go</button></form>';
    const openRoot = document.getElementById('open-host').attachShadow({ mode: 'open' });
    openRoot.innerHTML = shadowForm('open_shadow_form', 'Autosubmit form in an open shadow root.', true);
    const closedRoot = document.getElementById('closed-host').attachShadow({ mode: 'closed' });
    closedRoot.innerHTML = shadowForm('closed_shadow_form', 'Autosubmit form in a closed shadow root.', true)
      + shadowForm('closed_shadow_search', 'Form in a closed shadow root that waits for the user.', false);
    for (const form of [...openRoot.querySelectorAll('form'), ...closedRoot.querySelectorAll('form')]) {
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        window.__shadowSubmits = (window.__shadowSubmits || 0) + 1;
        if (event.agentInvoked) event.respondWith(Promise.resolve(`${form.getAttribute('toolname')} submitted`));
      });
    }
  </script>
</body>
</html>
