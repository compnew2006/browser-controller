<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebMCP demo frame</title>
</head>
<body>
  <!-- Same-origin child of webmcp-demo.html: registers a tool whose name
       collides with the main frame's `echo`, so callers must pass `frame`. -->
  <p>WebMCP frame</p>
  <!-- A declarative form named like the main frame's imperative `dup_tool`:
       it must gate only the frame's tool, not the main frame's. -->
  <form toolname="dup_tool" tooldescription="Frame form named like a main-frame tool.">
    <label>Value <input name="v"></label>
    <button type="submit">Send</button>
  </form>
  <script>
    const mc = document.modelContext;
    if (mc) {
      Promise.resolve(mc.registerTool({
        name: 'echo',
        description: 'Frame copy of echo.',
        inputSchema: { type: 'object', properties: { message: { type: 'string' } } },
        annotations: { readOnlyHint: true },
        execute: async ({ message }) => `frame echo: ${message}`,
      })).catch(() => {});
    }
  </script>
</body>
</html>
